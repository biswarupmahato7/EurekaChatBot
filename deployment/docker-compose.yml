# =============================================================================
# Eureka RAG Chatbot — Production / Staging Docker Compose Stack
# =============================================================================
# Services:
#   1. backend:       FastAPI service with ChromaDB vector store and OpenAI integration
#   2. frontend:      React 19 Vite production build served via unprivileged Nginx
#   3. reverse-proxy: Edge Nginx terminating TLS/HTTPS, rate limiting, and CORS
#
# Usage:
#   docker compose -f deployment/docker-compose.yml up -d
#   docker compose -f deployment/docker-compose.yml logs -f
# =============================================================================

version: "3.8"

services:
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: eureka-rag-backend:latest
    container_name: eureka_rag_backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - CHROMA_PERSIST_DIRECTORY=/app/data/vectorstore
      - PROCESSED_DATA_PATH=/app/data/processed/eureka_website_chunks.json
      - RAW_DATA_PATH=/app/data/raw/eureka_website_data.json
      - REPORTS_PATH=/app/data/reports
    volumes:
      # Persistent storage for ChromaDB vector index (survives restarts/re-deployments)
      - ../data/vectorstore:/app/data/vectorstore:rw
      - ../data/raw:/app/data/raw:ro
      - ../data/processed:/app/data/processed:ro
      - ../data/reports:/app/data/reports:rw
      - ../data/backups:/app/data/backups:rw
    networks:
      - eureka_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
      args:
        - VITE_EUREKA_API_BASE_URL=""
    image: eureka-rag-frontend:latest
    container_name: eureka_rag_frontend
    restart: unless-stopped
    networks:
      - eureka_internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3

  reverse-proxy:
    image: nginx:alpine
    container_name: eureka_reverse_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - eureka_internal

networks:
  eureka_internal:
    driver: bridge
