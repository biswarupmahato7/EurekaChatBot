services:
  - type: web
    name: eureka-rag-backend
    runtime: docker
    dockerfilePath: deployment/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_HOST
        value: 0.0.0.0
      - key: API_BASE_PATH
        value: /api/v1
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://*.vercel.app,https://eurekasolutions.in
      - key: CHROMA_PERSIST_DIRECTORY
        value: /app/data/vectorstore
      - key: CHROMA_COLLECTION
        value: eureka_website_chunks
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: EMBEDDING_DIMENSION
        value: "384"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: CANONICAL_BASE_URL
        value: https://eurekasolutions.in/Eureka2026/
