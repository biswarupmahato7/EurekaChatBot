# pytest configuration for the Eureka RAG Chatbot project
# Ensures pytest discovers tests from the repository root correctly
# across all sub-packages without requiring sys.path manipulation in test files.

[pytest]
pythonpath = .


# Test discovery paths
testpaths =
    crawler/tests
    backend/tests
    tests


# Minimum pytest version
minversion = 7.0

# Output options
addopts =
    -v
    --tb=short

# Show local variables in tracebacks
log_cli = false
log_level = WARNING
